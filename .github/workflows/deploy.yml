name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy-log.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Save deploy log (always, even on failure)
        if: always()
        run: |
          mkdir -p .deploy-logs
          cp /tmp/deploy-log.txt .deploy-logs/last-run.txt || echo "no log captured" > .deploy-logs/last-run.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .deploy-logs/last-run.txt
          git commit -m "chore: deploy log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"
